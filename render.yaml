services:
  - type: web
    name: nas-backend
    runtime: python
    buildCommand: pip install -r requirements.txt && cd nas_server && python manage.py migrate --noinput && python manage.py collectstatic --noinput
    startCommand: cd nas_server && gunicorn nas_server.wsgi:application
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "nas-backend.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://nas-backend.onrender.com"
