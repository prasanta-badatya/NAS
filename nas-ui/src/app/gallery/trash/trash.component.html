<div class="trash-shell">

  <header class="trash-header">
    <button class="btn-back" (click)="goBack()">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </span>
      Back
    </button>

    <div class="header-title">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
          <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
        </svg>
      </span>
      Trash
    </div>

    <button class="btn-empty" *ngIf="items.length" (click)="promptEmptyTrash()">
      Empty Trash
    </button>
    <div class="header-spacer" *ngIf="!items.length"></div>
  </header>

  <main>
    <div class="loading" *ngIf="loading">
      <span class="spinner"></span>
    </div>

    <div class="empty-state" *ngIf="!loading && items.length === 0">
      <span class="empty-icon icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
          <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
        </svg>
      </span>
      <p class="empty-title">Trash is empty</p>
      <p class="empty-sub">Deleted photos will appear here</p>
    </div>

    <div class="grid" *ngIf="!loading && items.length">
      <div class="card" *ngFor="let item of items">
        <div class="thumb">
          <img [src]="item.thumbnail_url || item.url" [alt]="item.filename" loading="lazy" />
          <div class="thumb-overlay">
            <span class="fname">{{ item.filename }}</span>
            <span class="fsize">{{ formatSize(item.file_size) }}</span>
          </div>
        </div>
        <div class="card-actions">
          <button class="btn-restore" (click)="restore(item.id)" title="Restore">
            <span class="icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="1 4 1 10 7 10"/>
                <path d="M3.51 15a9 9 0 1 0 .49-3.51"/>
              </svg>
            </span>
            Restore
          </button>
          <button class="btn-perm" (click)="promptPermanentDelete(item.id)" title="Delete forever">
            <span class="icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
            </span>
          </button>
        </div>
      </div>
    </div>
  </main>

</div>

<app-confirm-dialog
  *ngIf="confirmCallback"
  [message]="confirmMessage"
  confirmLabel="Delete Forever"
  (confirmed)="onConfirm()"
  (cancelled)="onCancel()">
</app-confirm-dialog>
