<div class="empty-state" *ngIf="groups.length === 0">
  <span class="empty-icon icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
      <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
      <circle cx="12" cy="13" r="4"/>
    </svg>
  </span>
  <p class="empty-title">No photos yet</p>
  <p class="empty-sub">Upload some photos to get started</p>
</div>

<div class="date-section" *ngFor="let group of groups">
  <div class="date-label">{{ group.label }}</div>

  <div class="grid" [class.select-mode]="selectMode">
    <div
      class="tile"
      *ngFor="let photo of group.photos"
      [class.selected]="selectedIds.has(photo.id)"
      (click)="onTileClick(photo, $event)"
      (contextmenu)="onRightClick($event, photo)"
      (touchstart)="onTouchStart(photo)"
      (touchend)="onTouchEnd(photo)"
    >
      <img [src]="photo.thumbnail_url || photo.url" [alt]="photo.filename" loading="lazy" />

      <!-- Checkbox overlay — always rendered, visibility controlled by CSS -->
      <div class="select-overlay">
        <span class="checkbox" [class.checked]="selectedIds.has(photo.id)">
          <svg *ngIf="selectedIds.has(photo.id)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" width="10" height="10">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </span>
      </div>

      <!-- Video badge -->
      <span class="video-badge" *ngIf="photo.media_type === 'video'">
        <svg viewBox="0 0 24 24" fill="currentColor" width="9" height="9">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
      </span>
    </div>
  </div>
</div>
