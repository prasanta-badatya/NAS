<div
  class="drop-zone"
  [class.dragging]="dragging"
  (dragover)="$event.preventDefault(); dragging=true"
  (dragleave)="dragging=false"
  (drop)="onDrop($event)"
>
  <input type="file" #fileInput multiple accept="image/*,video/*"
         (change)="onFileSelect($event)" hidden />

  <div class="drop-content" (click)="fileInput.click()">
    <span class="icon">☁</span>
    <p>Drag & drop photos here</p>
    <small>or tap to select · Max 500 MB per file</small>
  </div>
</div>

<div class="queue" *ngIf="items.length">
  <div *ngFor="let item of items" class="queue-item" [class]="item.status">

    <div class="item-header">
      <span class="status-icon">{{ statusIcon[item.status] }}</span>
      <span class="filename">{{ item.file.name }}</span>
      <span class="badge">{{ item.status }}</span>
    </div>

    <div class="progress-track" *ngIf="item.status === 'uploading' || item.status === 'done'">
      <div class="progress-bar" [style.width.%]="item.progress"></div>
    </div>

    <div class="error-msg" *ngIf="item.error">{{ item.error }}</div>
  </div>
</div>
