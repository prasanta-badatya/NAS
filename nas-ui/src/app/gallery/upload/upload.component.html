<div
  class="drop-zone"
  [class.dragging]="dragging"
  (dragover)="$event.preventDefault(); dragging=true"
  (dragleave)="dragging=false"
  (drop)="onDrop($event)"
  (click)="fileInput.click()"
>
  <input type="file" #fileInput multiple accept="image/*,video/*"
         (change)="onFileSelect($event)" hidden />

  <div class="drop-content">
    <span class="upload-icon icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="16 16 12 12 8 16"/>
        <line x1="12" y1="12" x2="12" y2="21"/>
        <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>
      </svg>
    </span>
    <p class="drop-title">Drop photos &amp; videos here</p>
    <p class="drop-sub">or click to browse · max 500 MB each</p>
  </div>
</div>

<div class="queue" *ngIf="items.length">
  <div *ngFor="let item of items" class="queue-item" [class]="item.status">

    <div class="item-header">
      <span class="status-icon icon" [ngSwitch]="item.status">
        <svg *ngSwitchCase="'done'" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        <svg *ngSwitchCase="'duplicate'" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
          <line x1="12" y1="9" x2="12" y2="13"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        <svg *ngSwitchCase="'error'" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="15" y1="9" x2="9" y2="15"/>
          <line x1="9" y1="9" x2="15" y2="15"/>
        </svg>
        <svg *ngSwitchDefault viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
      </span>
      <span class="filename">{{ item.file.name }}</span>
      <span class="badge" [ngSwitch]="item.status">
        <ng-container *ngSwitchCase="'uploading'">{{ item.progress }}%</ng-container>
        <ng-container *ngSwitchCase="'done'">Uploaded</ng-container>
        <ng-container *ngSwitchCase="'duplicate'">Duplicate</ng-container>
        <ng-container *ngSwitchCase="'error'">Failed</ng-container>
        <ng-container *ngSwitchDefault>Queued</ng-container>
      </span>
    </div>

    <div class="progress-track" *ngIf="item.status === 'uploading' || item.status === 'done'">
      <div class="progress-bar" [style.width.%]="item.progress"></div>
    </div>

    <div class="error-msg" *ngIf="item.error">{{ item.error }}</div>
  </div>
</div>
