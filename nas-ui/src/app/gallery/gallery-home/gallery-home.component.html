<div class="shell">

  <!-- ── Topbar ─────────────────────────────────────────────────────────────── -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
      </span>
      <span class="brand-name">Private NAS</span>
    </div>

    <nav class="topbar-nav">
      <a class="nav-item" routerLink="trash">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
            <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
          </svg>
        </span>
        Trash
      </a>

      <button class="btn-upload" (click)="showUpload = !showUpload">
        <span class="icon" *ngIf="!showUpload">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
        </span>
        <span class="icon" *ngIf="showUpload">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </span>
        {{ showUpload ? 'Cancel' : 'Upload' }}
      </button>

      <div class="user-chip" *ngIf="user">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </span>
        <span>{{ user.username }}</span>
      </div>

      <button class="btn-logout" (click)="logout()" title="Logout">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </span>
      </button>
    </nav>
  </header>

  <!-- ── Multi-select toolbar ────────────────────────────────────────────────── -->
  <div class="select-toolbar" *ngIf="selectMode">
    <span class="select-count">
      <strong>{{ selectedIds.size }}</strong> selected
    </span>
    <div class="select-actions">
      <button class="sel-btn" (click)="selectAll()">Select All</button>
      <button class="sel-btn" (click)="downloadSelected()" [disabled]="selectedIds.size === 0">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
        </span>
        Download
      </button>
      <button class="sel-btn danger" (click)="deleteSelected()" [disabled]="selectedIds.size === 0">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
            <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
          </svg>
        </span>
        Delete
      </button>
      <button class="sel-btn ghost" (click)="clearSelection()">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </span>
        Cancel
      </button>
    </div>
  </div>

  <!-- ── Upload panel ──────────────────────────────────────────────────────────  -->
  <div class="upload-panel" *ngIf="showUpload">
    <app-upload (uploaded)="onUploaded()"></app-upload>
  </div>

  <!-- ── Gallery ───────────────────────────────────────────────────────────────  -->
  <main>
    <app-photo-grid
      [groups]="groups"
      [selectMode]="selectMode"
      [selectedIds]="selectedIds"
      (photoClicked)="openPhoto($event)"
      (longPressed)="onLongPress($event)"
      (selectionToggled)="toggleSelect($event)"
    ></app-photo-grid>

    <div id="scroll-sentinel" class="sentinel"></div>

    <div class="loading-more" *ngIf="loading">
      <span class="spinner"></span>
    </div>

    <div class="end-msg" *ngIf="!hasMore && allPhotos.length > 0">
      {{ allPhotos.length }} photos · all loaded
    </div>
  </main>

  <!-- ── Viewer ────────────────────────────────────────────────────────────────  -->
  <app-viewer
    *ngIf="viewerOpen"
    [photos]="allPhotos"
    [startIndex]="viewerIndex"
    (closed)="onViewerClosed()"
    (deleted)="onViewerDeleted($event)"
  ></app-viewer>

  <!-- ── Confirm dialog ─────────────────────────────────────────────────────── -->
  <app-confirm-dialog
    *ngIf="confirmCallback"
    [message]="confirmMessage"
    (confirmed)="onConfirm()"
    (cancelled)="onCancel()"
  ></app-confirm-dialog>

</div>
