<div class="login-page">
  <div class="login-card">

    <div class="logo">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
      </span>
      <span class="logo-text">Private NAS</span>
    </div>

    <h2>Welcome back</h2>
    <p class="subtitle">Sign in to your photo vault</p>

    <div class="error-banner" *ngIf="error">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
      </span>
      {{ error }}
    </div>

    <div class="field">
      <label>Username</label>
      <input type="text" placeholder="Enter username" [(ngModel)]="username" (keyup.enter)="login()" autocomplete="username" />
    </div>

    <div class="field">
      <label>Password</label>
      <input type="password" placeholder="Enter password" [(ngModel)]="password" (keyup.enter)="login()" autocomplete="current-password" />
    </div>

    <button class="btn-signin" (click)="login()" [disabled]="loading">
      <span *ngIf="!loading">Sign In</span>
      <span *ngIf="loading" class="loading-dots">
        <span></span><span></span><span></span>
      </span>
    </button>
  </div>
</div>
